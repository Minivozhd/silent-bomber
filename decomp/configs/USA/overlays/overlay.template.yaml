# @@TITLE@@
# GENERATED by decomp/tools/gen_overlay_configs.py from codemap.json.
# Do not edit this file - edit decomp/tools/extract_packages.py (code map)
# or configs/USA/overlays/overlay.template.yaml (options), then re-run
# decomp/tools/extract_packages.sh.
# Source: @@TARGET@@
# Load address: @@VRAM@@  size: @@SIZE_HEX@@ (@@SIZE@@)
name: "@@TITLE@@"
sha1: @@SHA1@@
options:
  basename: @@NAME@@
  target_path: @@TARGET@@
  base_path: ../../..
  platform: psx
  compiler: PSYQ

  asset_path: asm/USA/incbin

  asm_path: asm/USA/packages/@@NAME@@
  src_path: src/packages/@@NAME@@
  build_path: build/USA
  hasm_in_src_path: True

  ld_script_path: linkers/USA/packages/@@NAME@@.ld

  # Flat DATA.BIN package part2: no PS-X EXE header. Layout is
  #   header/strings -> .text -> trailing data (jump tables, names,
  #   registration records) so section_order keeps .rodata before .text.
  migrate_rodata_to_functions: True
  find_file_boundaries: False
  pair_rodata_to_text: False

  o_as_suffix: False
  use_legacy_include_asm: False

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  generate_asm_macros_files: False

  # Every package loads at the same address (0x800DD4F0; ARENAP at
  # 0x801A0000), so a bare func_<vram> would collide between overlays.
  symbol_name_format: $SEG_$VRAM

  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]

  undefined_funcs_auto_path: linkers/USA/packages/undefined_funcs_auto.@@NAME@@.txt
  undefined_syms_auto_path: linkers/USA/packages/undefined_syms_auto.@@NAME@@.txt

  subalign: 4

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  ld_bss_is_noload: True
  # Package sizes are not word-aligned; do not pad sections to align.
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False

segments:
  - name: @@NAME@@
    type: code
    start: 0x0
    vram: @@VRAM@@
    align: 4
    subalign: 4
    subsegments:
@@SUBSEGMENTS@@
  - [@@SIZE_HEX@@]
